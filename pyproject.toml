[project]
name = "community-management"
version = "0.1.0"
description = "Intelligent Community Management Analytics Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Core runtime dependencies for Week 1 (data layer + ingestion + API).
# Heavier ML/LLM deps (transformers, bertopic, litellm, langgraph) arrive in
# their own roadmap weeks to keep the Week 1 image small and buildable.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "celery==5.4.0",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "python-multipart==0.0.20",
    "structlog==24.4.0",
    "python-dateutil==2.9.0.post0",
    # Light, pure-Python language detection. The heavy sentiment transformer is
    # in the `nlp` extra; language routing works without it.
    "langdetect==1.0.9",
    # HTTP client for the live connectors (Meta Graph API, YouTube Data API).
    # 0.27.2 (not 0.28) so litellm's httpx<0.28 constraint is satisfied. Our usage
    # (httpx.get, httpx.HTTPError) is identical across both.
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "fakeredis==2.26.2",
]

# Week 3 sentiment model (Model A). Heavy (~2 GB with torch); installed only where
# real inference runs. The app and tests work without it via the injectable backend.
nlp = [
    "transformers==4.48.0",
    "torch==2.5.1",
    # XLM-RoBERTa uses a SentencePiece tokenizer; transformers needs these to load it.
    "sentencepiece==0.2.0",
    "protobuf==4.25.5",
]

# Week 4 fine-tuning (Model B). Runs on a Colab/Kaggle GPU, not the app image.
train = [
    "datasets==3.2.0",
    "accelerate==1.2.1",
    "mlflow==2.19.0",
]

# Week 6 LLM gateway. litellm gives one interface (and failover) across Groq,
# Gemini, OpenRouter, NVIDIA NIM, and a local Ollama.
llm = [
    "litellm==1.55.10",
    # litellm 1.55 targets the openai 1.x SDK; pin below 2.0 so a newer major
    # (which changed the SDK surface litellm calls) is not pulled in.
    "openai>=1.55.3,<2",
]

# Week 7 analyst agent. LangGraph orchestrates the think/act loop; the tools are
# this project's own analytics functions, so no LangChain integrations are needed.
agent = [
    "langgraph>=0.2.60,<2",
]

# Week 8 topic modeling. NOT installed in the app image, and it cannot be
# installed alongside the core pins: bertopic pulls umap-learn and hdbscan, which
# need numba, which caps numpy below 2.1 while the analytics layer pins numpy
# 2.2.1. Install it in a separate environment (a notebook, or a dedicated worker
# image built with numpy relaxed) the same way the `train` extra runs on Colab.
# Without it the /topics endpoints answer 503 with an install hint.
topics = [
    "bertopic>=0.16,<0.18",
    "sentence-transformers>=3.0,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks legitimately interleave imports with code (E402) and set env vars before
# imports; they are not application code, so they are not linted as such.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E,F pycodestyle/pyflakes; I isort; B bugbear; UP pyupgrade; N naming.
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = [
    "E501",   # line length handled by formatter, not linter
    "B008",   # FastAPI dependency injection uses Depends()/Query() in defaults by design
    "UP017",  # project standardizes on datetime.timezone.utc (explicit, 3.10-safe)
    "UP037",  # SQLAlchemy Mapped["X"] forward refs are cross-module and must stay quoted
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
# Coverage target per brief Section 13: >80% on analytics/ and nlp/.
# Enable with: pytest --cov=app/analytics --cov=app/nlp --cov-report=term-missing

[tool.coverage.run]
# These two are offline CLI entry points, not application code: they run on a
# Colab/Kaggle GPU with the `train` extra and a dataset, and nothing in the served
# app imports them. Counting them as uncovered app code understates coverage of the
# code that actually runs in production. The pure logic they depend on
# (training/data.py and training/metrics.py) is fully tested and stays measured.
omit = [
    "app/nlp/training/finetune_tunizi.py",
    "app/nlp/training/evaluate.py",
]

[tool.mypy]
python_version = "3.11"
# Loose per brief Section 5: signal, not a gate.
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
